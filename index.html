<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>五子棋 — 暖色舒適</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #FDF6E9;
      --surface: #FFFCF7;
      --board: #8B5A2B;  /* walnut wood */
      --grid: #5C3317;    /* dark wood */
      --black: #2C1810;
      --white: #FFFAF0;  /* floral white */
      --accent: #E07A5F;
      --accent-dark: #c96a52;
      --text-primary: #3D2914;
      --text-secondary: #9A8B7A;
      --winner-glow: #F4A261;
      --cell-size: 44px;
      --piece-size: 38px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      color: var(--text-primary);
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: 600;
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-align: center;
    }

    .status {
      font-size: 16px;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 20px;
      height: 24px;
      text-align: center;
      transition: color 0.3s ease;
    }

    .board-wrapper {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      box-shadow:
        0 4px 24px rgba(61, 41, 20, 0.12),
        0 2px 8px rgba(61, 41, 20, 0.08);
    }

    .mode-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .mode-title {
      font-family: Georgia, serif;
      font-size: 22px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .mode-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      font-size: 16px;
      padding: 16px 32px;
      min-width: 140px;
    }

    .board.disabled {
      pointer-events: none;
      opacity: 0.85;
    }

    .board.computer-thinking {
      animation: computerPulse 0.8s ease-in-out infinite;
    }

    @keyframes computerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, var(--cell-size));
      grid-template-rows: repeat(15, var(--cell-size));
      background-color: var(--board);
      border-radius: 8px;
      position: relative;
      /* subtle wood grain effect */
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 20px,
          rgba(139, 105, 20, 0.05) 20px,
          rgba(139, 105, 20, 0.05) 21px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 40px,
          rgba(139, 105, 20, 0.03) 40px,
          rgba(139, 105, 20, 0.03) 41px
        );
      box-shadow: inset 0 2px 8px rgba(61, 41, 20, 0.2);
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Grid lines via borders */
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
    }

    /* Top row: no top border */
    .cell:nth-child(-n+15) {
      border-top: 1px solid var(--grid);
    }

    /* Left column: no left border */
    .cell:nth-child(15n+1) {
      border-left: 1px solid var(--grid);
    }

    /* Remove double borders at edges */
    .cell:nth-child(1) {
      border-top-left-radius: 8px;
    }
    .cell:nth-child(15) {
      border-top-right-radius: 8px;
    }
    .cell:nth-child(225) {
      border-bottom-left-radius: 8px;
    }
    .cell:nth-child(240) {
      border-bottom-right-radius: 8px;
    }

    .cell::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.15s ease;
    }

    .cell:hover::before {
      background: rgba(244, 162, 97, 0.25);
    }

    .piece {
      width: var(--piece-size);
      height: var(--piece-size);
      border-radius: 50%;
      position: absolute;
      z-index: 2;
      transform: scale(0.7);
      animation: placePiece 350ms ease-out forwards;
    }

    @keyframes placePiece {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .piece.black {
      background: radial-gradient(circle at 35% 35%, #4a2e1e, var(--black) 60%);
      box-shadow:
        0 3px 8px rgba(44, 24, 16, 0.4),
        inset 0 -2px 4px rgba(0,0,0,0.3),
        inset 0 2px 4px rgba(255,255,255,0.1);
    }

    .piece.white {
      background: radial-gradient(circle at 35% 35%, #ffffff, var(--white) 60%);
      border: 1px solid #d4c5a9;
      box-shadow:
        0 3px 8px rgba(44, 24, 16, 0.25),
        inset 0 -2px 4px rgba(0,0,0,0.08),
        inset 0 2px 4px rgba(255,255,255,0.8);
    }

    /* Last move marker */
    .piece.last-move::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--winner-glow);
      opacity: 0.7;
    }

    .piece.winner {
      transform: scale(1) !important;
      animation: winnerGlow 1s ease-in-out infinite;
    }

    @keyframes winnerGlow {
      0%, 100% {
        box-shadow:
          0 0 0 0 rgba(244, 162, 97, 0),
          0 3px 8px rgba(44, 24, 16, 0.3);
      }
      50% {
        box-shadow:
          0 0 16px 6px rgba(244, 162, 97, 0.6),
          0 3px 8px rgba(44, 24, 16, 0.3);
      }
    }

    .buttons {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }

    button {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow:
        0 4px 12px rgba(224, 122, 95, 0.3),
        0 2px 4px rgba(224, 122, 95, 0.2);
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--accent-dark);
      box-shadow:
        0 6px 16px rgba(224, 122, 95, 0.4),
        0 2px 4px rgba(224, 122, 95, 0.2);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      background: #c4b49a;
      cursor: not-allowed;
      box-shadow: none;
    }

    .difficulty-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px 20px;
  }

  .difficulty-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .diff-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 16px;
    min-width: 90px;
    font-size: 14px;
    line-height: 1.3;
  }

  .diff-btn .stars {
    font-size: 20px;
  }
 */
    @media (max-width: 700px) {
      :root {
        --cell-size: min(6vw, 36px);
        --piece-size: calc(var(--cell-size) - 6px);
      }

      body {
        padding: 16px 8px;
      }

      h1 {
        font-size: 22px;
      }

      .board-wrapper {
        padding: 10px;
      }

      .buttons {
        gap: 12px;
        margin-top: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      :root {
        --cell-size: min(6vw, 28px);
        --piece-size: calc(var(--cell-size) - 4px);
      }

      .status {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <h1>五子棋</h1>
  <div class="status" id="status">⚫ 黑方先行</div>

  <!-- Mode Selection -->
  <div class="mode-screen" id="modeScreen">
    <div class="mode-title">選擇模式</div>
    <div class="mode-buttons">
      <button id="twoPlayerBtn" class="mode-btn">👥 雙人模式</button>
      <button id="computerBtn" class="mode-btn">🤖 電腦模式</button>
    </div>
  </div>

  <!-- Difficulty Selection -->
  <div class="difficulty-screen" id="difficultyScreen" style="display:none;">
    <div class="mode-title">選擇難度</div>
    <div class="difficulty-buttons" id="difficultyButtons"></div>
    <button id="backToModeBtn" style="margin-top:8px;background:#9A8B7A;font-size:14px;padding:8px 20px;">← 返回</button>
  </div>

  <div class="board-wrapper" id="boardWrapper" style="display:none;">
    <div class="board" id="board"></div>
  </div>

  <div class="buttons" id="gameButtons" style="display:none;">
    <button id="newGameBtn">New Game</button>
    <button id="undoBtn" disabled>Undo</button>
    <button id="changeModeBtn">換模式</button>
  </div>

  <script>
    const BOARD_SIZE = 15;
    const EMPTY = 0;
    const BLACK = 1;
    const WHITE = 2;

    let board = [];
    let history = [];
    let currentPlayer = BLACK;
    let gameOver = false;
    let lastMovePos = null;
    let winningCells = [];
    let gameMode = null; // 'two-player' or 'computer'
    let computerThinking = false;
    let difficulty = 3; // 1-5, default level 3

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const newGameBtn = document.getElementById('newGameBtn');
    const undoBtn = document.getElementById('undoBtn');
    const changeModeBtn = document.getElementById('changeModeBtn');
    const modeScreen = document.getElementById('modeScreen');
  const difficultyScreen = document.getElementById('difficultyScreen');
  const difficultyButtons = document.getElementById('difficultyButtons');
  const backToModeBtn = document.getElementById('backToModeBtn');
    const boardWrapper = document.getElementById('boardWrapper');
    const gameButtons = document.getElementById('gameButtons');
    const twoPlayerBtn = document.getElementById('twoPlayerBtn');
    const computerBtn = document.getElementById('computerBtn');

    function init() {
      board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
      history = [];
      currentPlayer = BLACK;
      gameOver = false;
      lastMovePos = null;
      winningCells = [];
      computerThinking = false;
      renderBoard();
      updateStatus();
      undoBtn.disabled = true;
    }

    function startMode(mode) {
      gameMode = mode;
      modeScreen.style.display = 'none';
      boardWrapper.style.display = 'block';
      gameButtons.style.display = 'flex';
      init();
    }

    function showDifficultyScreen() {
      difficultyScreen.style.display = 'flex';
      boardWrapper.style.display = 'none';
      gameButtons.style.display = 'none';
      buildDifficultyButtons();
    }

    function buildDifficultyButtons() {
      difficultyButtons.innerHTML = '';
      const levels = [
        { level: 1, stars: '⭐', label: '新手' },
        { level: 2, stars: '⭐⭐', label: '業餘' },
        { level: 3, stars: '⭐⭐⭐', label: '普通' },
        { level: 4, stars: '⭐⭐⭐⭐', label: '高手' },
        { level: 5, stars: '⭐⭐⭐⭐⭐', label: '大師' }
      ];
      levels.forEach(({ level, stars, label }) => {
        const btn = document.createElement('button');
        btn.className = 'diff-btn';
        btn.innerHTML = `<span class="stars">${stars}</span><span>${label}</span>`;
        btn.addEventListener('click', () => startWithDifficulty(level));
        difficultyButtons.appendChild(btn);
      });
    }

    function startWithDifficulty(level) {
      difficulty = level;
      difficultyScreen.style.display = 'none';
      startMode('computer');
    }

    function showModeScreen() {
      gameMode = null;
      modeScreen.style.display = 'flex';
      difficultyScreen.style.display = 'none';
      boardWrapper.style.display = 'none';
      gameButtons.style.display = 'none';
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (board[r][c] !== EMPTY) {
            const piece = document.createElement('div');
            piece.className = `piece ${board[r][c] === BLACK ? 'black' : 'white'}`;

            if (lastMovePos && lastMovePos.r === r && lastMovePos.c === c) {
              piece.classList.add('last-move');
            }

            if (winningCells.some(([wr, wc]) => wr === r && wc === c)) {
              piece.classList.add('winner');
            }

            cell.appendChild(piece);
          }

          cell.addEventListener('click', () => handleClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function handleClick(r, c) {
      if (gameOver || board[r][c] !== EMPTY || computerThinking) return;
      if (gameMode === 'computer' && currentPlayer === WHITE) return;

      placePiece(r, c, currentPlayer);

      const winner = checkWin(r, c, currentPlayer);
      if (winner) {
        gameOver = true;
        winningCells = winner;
        renderBoard();
        updateStatus();
        undoBtn.disabled = history.length === 0;
        return;
      }

      currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
      renderBoard();
      updateStatus();
      undoBtn.disabled = false;

      // Trigger computer move if in computer mode
      if (gameMode === 'computer' && currentPlayer === WHITE && !gameOver) {
        triggerComputerMove();
      }
    }

    function placePiece(r, c, player) {
      board[r][c] = player;
      history.push({ r, c, player });
      lastMovePos = { r, c };
    }

    function triggerComputerMove() {
      computerThinking = true;
      boardEl.classList.add('disabled', 'computer-thinking');
      updateStatus();

      const baseDelay = 400 + (difficulty - 1) * 250; // 400ms L1 → 1400ms L5
      const delay = baseDelay + Math.random() * 200;
      setTimeout(() => {
        computerMove();
        computerThinking = false;
        boardEl.classList.remove('disabled', 'computer-thinking');
      }, delay);
    }

    function computerMove() {
      const move = findBestMove();
      if (!move) return;

      const { r, c } = move;
      placePiece(r, c, WHITE);

      const winner = checkWin(r, c, WHITE);
      if (winner) {
        gameOver = true;
        winningCells = winner;
        renderBoard();
        updateStatus();
        undoBtn.disabled = history.length === 0;
        return;
      }

      currentPlayer = BLACK;
      renderBoard();
      updateStatus();
      undoBtn.disabled = false;
    }

    // ─── AI Strategy Dispatcher ────────────────────────────────────────────
    function findBestMove() {
      if (difficulty <= 3) return findBestMoveHeuristic();
      return findBestMoveMinimax();
    }

    // ─── Level 1-3: Heuristic AI ────────────────────────────────────────────
    function findBestMoveHeuristic() {
      const emptyCells = getCandidateCells();
      if (emptyCells.length === 0) return null;

      // 1. Win if possible
      for (const { r, c } of emptyCells) {
        board[r][c] = WHITE;
        if (checkWin(r, c, WHITE)) { board[r][c] = EMPTY; return { r, c }; }
        board[r][c] = EMPTY;
      }

      // 2. Block player's winning move
      for (const { r, c } of emptyCells) {
        board[r][c] = BLACK;
        if (checkWin(r, c, BLACK)) { board[r][c] = EMPTY; return { r, c }; }
        board[r][c] = EMPTY;
      }

      if (difficulty === 1) {
        // Level 1: pick random from top 5 closest to center
        const center = Math.floor(BOARD_SIZE / 2);
        emptyCells.sort((a, b) => {
          const dA = Math.abs(a.r - center) + Math.abs(a.c - center);
          const dB = Math.abs(b.r - center) + Math.abs(b.c - center);
          return dA - dB;
        });
        const top = emptyCells.slice(0, Math.min(5, emptyCells.length));
        return top[Math.floor(Math.random() * top.length)];
      }

      // Level 2-3: score all candidates
      const scored = emptyCells.map(({ r, c }) => {
        const score = evaluatePosition(r, c, WHITE) +
          (difficulty >= 3 ? evaluatePosition(r, c, BLACK) * 0.9 : 0);
        return { r, c, score };
      });

      scored.sort((a, b) => b.score - a.score);
      // Pick from top 3 with slight randomness to feel more natural
      const top = scored.slice(0, Math.min(3, scored.length));
      return top[Math.floor(Math.random() * top.length)];
    }

    // Get cells that are empty AND adjacent to at least one existing piece
    function getCandidateCells() {
      const candidates = [];
      const hasPieces = history.length > 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] !== EMPTY) continue;
          if (!hasPieces) { candidates.push({ r, c }); continue; }
          // Only consider cells near existing pieces
          let near = false;
          outer: for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== EMPTY) {
                near = true; break outer;
              }
            }
          }
          if (near) candidates.push({ r, c });
        }
      }
      // Fallback: if board is empty, return center
      if (candidates.length === 0) {
        const center = Math.floor(BOARD_SIZE / 2);
        return [{ r: center, c: center }];
      }
      return candidates;
    }

    // Evaluate how good a position is for `player`
    // Score = line bonuses + center distance bonus
    function evaluatePosition(r, c, player) {
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      let totalScore = 0;
      const center = Math.floor(BOARD_SIZE / 2);
      const centerDist = Math.max(0, 7 - (Math.abs(r - center) + Math.abs(c - center)));
      totalScore += centerDist * 2;

      for (const [dr, dc] of directions) {
        const line = [[r, c]];
        let openEnds = 0;

        // Forward direction
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
          line.push([nr, nc]); nr += dr; nc += dc;
        }
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === EMPTY) openEnds++;

        // Backward direction
        nr = r - dr; nc = c - dc;
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
          line.push([nr, nc]); nr -= dr; nc -= dc;
        }
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === EMPTY) openEnds++;

        if (line.length >= 2 && openEnds === 2) {
          // Open-ended 2+: significant threat
          const mult = line.length === 4 ? 50000 : line.length === 3 ? 5000 : line.length === 2 ? 200 : 30;
          totalScore += mult;
        } else if (line.length >= 2) {
          const mult = line.length === 4 ? 1000 : line.length === 3 ? 100 : line.length === 2 ? 20 : 5;
          totalScore += mult;
        }
      }

      return totalScore;
    }

    // ─── Level 4-5: Minimax AI ──────────────────────────────────────────────
    function findBestMoveMinimax() {
      const depth = difficulty === 5 ? 4 : 3;
      const emptyCells = getCandidateCells();
      if (emptyCells.length === 0) return null;

      let bestScore = -Infinity;
      let bestMove = emptyCells[0];
      const alpha = -Infinity;
      const beta = Infinity;

      for (const { r, c } of emptyCells) {
        board[r][c] = WHITE;
        const score = minimax(depth - 1, alpha, beta, false);
        board[r][c] = EMPTY;
        if (score > bestScore) {
          bestScore = score;
          bestMove = { r, c };
        }
      }

      return bestMove;
    }

    function minimax(depth, alpha, beta, isMaximizing) {
      if (depth === 0) return evaluateBoard();

      const emptyCells = getCandidateCells();
      if (emptyCells.length === 0) return evaluateBoard();

      const player = isMaximizing ? WHITE : BLACK;

      if (isMaximizing) {
        let maxScore = -Infinity;
        for (const { r, c } of emptyCells) {
          board[r][c] = player;
          // Check for win
          if (checkWin(r, c, player)) { board[r][c] = EMPTY; return 1000000 + depth; }
          const score = minimax(depth - 1, alpha, beta, false);
          board[r][c] = EMPTY;
          maxScore = Math.max(maxScore, score);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
        return maxScore;
      } else {
        let minScore = Infinity;
        for (const { r, c } of emptyCells) {
          board[r][c] = player;
          if (checkWin(r, c, player)) { board[r][c] = EMPTY; return -1000000 - depth; }
          const score = minimax(depth - 1, alpha, beta, true);
          board[r][c] = EMPTY;
          minScore = Math.min(minScore, score);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return minScore;
      }
    }

    function evaluateBoard() {
      let score = 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === WHITE) score += evaluatePosition(r, c, WHITE);
          else if (board[r][c] === BLACK) score -= evaluatePosition(r, c, BLACK);
        }
      }
      return score;
    }
    function checkWin(r, c, player) {
      const directions = [
        [[0, 1], [0, -1]],   // horizontal
        [[1, 0], [-1, 0]],   // vertical
        [[1, 1], [-1, -1]], // diagonal
        [[1, -1], [-1, 1]]  // anti-diagonal
      ];

      for (const [dir1, dir2] of directions) {
        const cells = [[r, c]];

        // dir1
        let nr = r + dir1[0], nc = c + dir1[1];
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
          cells.push([nr, nc]);
          nr += dir1[0];
          nc += dir1[1];
        }

        // dir2
        nr = r + dir2[0]; nc = c + dir2[1];
        while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
          cells.push([nr, nc]);
          nr += dir2[0];
          nc += dir2[1];
        }

        if (cells.length >= 5) return cells;
      }

      return null;
    }

    function updateStatus() {
      if (gameOver) {
        const winner = currentPlayer === BLACK ? '⚫ 黑方' : '⚪ 白方';
        statusEl.textContent = `🎉 ${winner}獲勝！`;
      } else if (gameMode === 'computer') {
        if (currentPlayer === BLACK) {
          statusEl.textContent = '⚫ 你的回合';
        } else if (computerThinking) {
          statusEl.textContent = '🤖 電腦思考中...';
        } else {
          statusEl.textContent = '🤖 電腦行棋...';
        }
      } else {
        const symbol = currentPlayer === BLACK ? '⚫' : '⚪';
        const label = currentPlayer === BLACK ? '黑方' : '白方';
        statusEl.textContent = `${symbol} ${label}行棋`;
      }
    }

    function undo() {
      if (history.length === 0 || gameOver) return;

      const last = history.pop();
      board[last.r][last.c] = EMPTY;

      // In computer mode, also undo computer's last move
      if (gameMode === 'computer' && history.length > 0) {
        const prev = history.pop();
        board[prev.r][prev.c] = EMPTY;
      }

      // Recalculate lastMovePos and currentPlayer
      if (history.length === 0) {
        lastMovePos = null;
        currentPlayer = BLACK;
      } else {
        const prev = history[history.length - 1];
        lastMovePos = { r: prev.r, c: prev.c };
        currentPlayer = prev.player === BLACK ? WHITE : BLACK;
      }

      winningCells = [];
      computerThinking = false;
      boardEl.classList.remove('disabled', 'computer-thinking');
      renderBoard();
      updateStatus();
      undoBtn.disabled = history.length === 0;
    }

    newGameBtn.addEventListener('click', init);
    undoBtn.addEventListener('click', undo);
    changeModeBtn.addEventListener('click', showModeScreen);
    backToModeBtn.addEventListener('click', showModeScreen);
    twoPlayerBtn.addEventListener('click', () => startMode('two-player'));
    computerBtn.addEventListener('click', showDifficultyScreen);

    showModeScreen();
  </script>

</body>
</html>
